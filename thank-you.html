<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Contacting SultanFilms!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Or match your site's background */
        }
        /* You can add glassmorphism-overlay styling here if you want it for the thank you message */
        .glassmorphism-overlay {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center">
    <div class="glassmorphism-overlay text-center p-8 md:p-12 rounded-xl shadow-lg max-w-md mx-auto">
        <h1 class="text-4xl md:text-5xl font-bold mb-4">Thank You!</h1>
        <p class="text-xl md:text-2xl text-gray-200 mb-6">Your message has been successfully sent.</p>
        <p class="text-lg text-gray-300 mb-8">I'll get back to you as soon as possible.</p>
        <a href="/" class="bg-blue-600 text-white px-8 py-3 rounded-full text-lg font-semibold hover:bg-blue-700 transition duration-300 ease-in-out transform hover:scale-105 shadow-lg">
            Return to Homepage
        </a>
    </div>
</body>
</html>
